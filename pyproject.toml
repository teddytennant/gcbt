[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gcbt"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "jax",
    "numpy",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["gcbt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
